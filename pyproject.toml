# V-Scanner 3.0 — development tooling configuration (updated Stage 03).
#
# Stage 03 adds the [project] packaging table for the new engine package
# (vscanner/) with its three proven runtime dependencies. Production
# dependency declarations for the legacy CLI remain in cli/requirements.txt
# unchanged.
# This file also configures pytest, coverage, Ruff and mypy.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vscanner"
version = "3.0.0a0"
description = "V-Scanner 3.0: Android security scanning engine (typed services core)"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
    "click>=8.0.0",
    "jinja2>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "coverage",
    "ruff",
    "mypy",
]

[tool.setuptools]
packages = [
    "vscanner",
    "vscanner.core",
    "vscanner.core.kb",
    "vscanner.services",
    "vscanner.services.adb",
    "vscanner.services.reports",
    "vscanner.services.scanning",
    "vscanner.services.tools",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
xfail_strict = true
# Strict xfails: a passing xfail becomes a hard failure, so a stage that
# remediates a defect MUST update the marker and the remediation plan row.
# tarfile emits a Python 3.12 deprecation warning about default extraction
# filters while the legacy extraction behavior is being characterized (R-11).
filterwarnings = [
    "ignore:Python 3.14 will, by default, filter extracted tar archives:DeprecationWarning",
]

[tool.coverage.run]
# Measure coverage of the legacy CLI package AND the new engine package.
# Values are reported honestly in docs/vscanner-3/TESTING_STRATEGY.md.
source = ["cli", "vscanner", "ui_terminal", "ui_desktop"]
omit = ["cli/setup.py", "cli/python usb_charging_control.py"]

[tool.ruff]
target-version = "py310"
line-length = 120
# Legacy cli/ gets lint enforcement when each module migrates (Stages 03+).
# Enforcing today would fail on pre-existing defects that are scheduled for
# remediation (SECURITY_AND_REMEDIATION_PLAN R-10/R-15) — not this stage.
extend-exclude = ["cli", "android"]

[tool.ruff.lint]
# Minimal achievable baseline for NEW code (tests/docs tooling):
# E9 syntax/runtime-level errors, F63/F7/F82 invalid checks,
# E722 bare-except ban, F811 duplicate defs, F841 unused locals,
# B006 mutable-default, B015 useless comparison, B018 useless expression.
select = ["E9", "F63", "F7", "F82", "E722", "F811", "F841", "B006", "B015", "B018"]

[tool.mypy]
# Stage 03: type-check the new tests AND the engine package. Stage 04 adds
# the bridge stubs (ui_terminal/ui_desktop — framework-free adapter layers).
# Legacy cli/ imports are followed "silently" (errors inside legacy code stay
# suppressed until each module migrates), while unresolved imports surface.
files = ["tests", "vscanner", "ui_terminal", "ui_desktop"]
mypy_path = "cli"
follow_imports = "silent"
ignore_missing_imports = true
